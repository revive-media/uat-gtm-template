# Releases a new template version to the Community Template Gallery.
#
# When a pull request with the `release` label is merged into main, this adds
# the merge commit's SHA to the top of `versions` in metadata.yaml, then opens
# and merges a pull request with that change. main requires pull requests, so
# the workflow cannot push to it directly. The Gallery picks up the new version
# within two to three days.
#
# It runs on push to main rather than on pull_request: push always gets a write
# token, even for a PR from a fork, without pull_request_target. It looks up
# the merged PR from the pushed commit and stops unless that PR has the label.
#
# There is no concurrency group: GitHub keeps only one pending run per group
# and cancels the rest, which would drop releases. If two releases race, the
# second release PR conflicts on metadata.yaml and fails; rerun it.

name: Release to Gallery

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      PR_FILE: ${{ runner.temp }}/pr.json
    steps:
      - name: Find the merged pull request
        id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .merge_commit_sha == $ENV.SHA)][0] // {}' > "$PR_FILE"
          if jq -e '(.labels // []) | map(.name) | index("release")' "$PR_FILE" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a merge of a PR labeled release. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pr.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - if: steps.pr.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the merged template
        if: steps.pr.outputs.release == 'true'
        run: npm test

      # PR text goes through env vars, never inline ${{ }}, so it cannot
      # inject shell commands.
      - name: Add the version to metadata.yaml
        if: steps.pr.outputs.release == 'true'
        run: |
          export PR_TITLE="$(jq -r '.title // ""' "$PR_FILE")"
          export PR_BODY="$(jq -r '.body // ""' "$PR_FILE")"
          node scripts/add-release.mjs "$SHA"

      # A pull request opened with GITHUB_TOKEN does not trigger workflows, so
      # this cannot loop.
      - name: Open and merge the release pull request
        if: steps.pr.outputs.release == 'true'
        run: |
          PR_NUMBER="$(jq -r .number "$PR_FILE")"
          BRANCH="release/${SHA:0:7}"
          TITLE="Release ${SHA:0:7} to the Community Template Gallery"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c "$BRANCH"
          git add metadata.yaml
          git commit --quiet -m "$TITLE (#$PR_NUMBER)"
          # --force and the PR lookup let a rerun replace a failed attempt.
          git push --quiet --force origin "$BRANCH"
          URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Adds $SHA from #$PR_NUMBER to metadata.yaml. Opened and merged by the Release to Gallery workflow.")
          fi
          gh pr merge "$URL" --merge --delete-branch
