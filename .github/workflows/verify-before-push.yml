# Runs the template tests on every pull request, including PRs from forks.
#
# It uses pull_request, not pull_request_target, so a fork's PR runs with a
# read-only token and no secrets. The job only needs to read the code.

name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same Node version as the Release to Gallery workflow.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install: the tests use node:test and the GTM sandbox shim in test/.
      - name: Run tests
        run: npm test
